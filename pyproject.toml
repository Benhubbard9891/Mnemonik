[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mnemonik-evoke"
version = "1.0.0rc1"
description = "Local fact memory with scoped supersession and hash-linked receipts"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Benjamin L. Hubbard III"}]
dependencies = ["aiosqlite==0.21.0"]

[project.scripts]
mnemonik = "mnemonik.cli:main"

[tool.setuptools.packages.find]
include = ["mnemonik*"]
